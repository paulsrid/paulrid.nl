<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole</title>
<style>
  html, body { margin: 0; height: 100%; background: #050302; }
  body { display: flex; align-items: center; justify-content: center; }
  .panel { position: fixed; top: 12px; left: 12px; z-index: 1; padding: 8px 12px; border-radius: 6px;
           background: rgba(0,0,0,.55); color: #e8d6c0; font: 13px system-ui, sans-serif; user-select: none;
           display: flex; flex-direction: column; gap: 6px; }
  .panel label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .panel input[type=range] { width: 110px; }
  .panel.busy { opacity: .5; cursor: progress; }
  .panel.busy label { cursor: progress; }
  canvas { width: 100vw; height: 100vh;  object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="panel busy" id="panel">
  <label><input type="checkbox" id="finish" checked disabled> Finish (bloom)</label>
  <label><input type="checkbox" id="spin" checked disabled> Spin disk</label>
  <label>Speed <input type="range" id="speed" min="0" max="3" step="0.1" value="1" disabled></label>
  <span id="status">Computing…</span>
</div>
<canvas id="c" width="1280" height="720"></canvas>
<script>
/*
  Ray-traced Schwarzschild black hole with a thin accretion disk.
  Each pixel is a light ray traced backwards from a distant observer. In the plane of the ray,
  with u = 1/r (units of M), the photon path obeys  u'' = -u + 3u^2  (derivatives wrt angle phi).
  The rays are traced once and the disk crossings cached; the disk texture is a polar lookup table
  that is rotated each frame (differentially: inner gas orbits faster) to animate the spin.
*/
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, NPIX = W * H;

// ---- scene parameters ----
const INCL = 84 * Math.PI / 180;      // viewing angle from the spin axis (90 = edge-on)
const TILT = 0.27;                    // in-image rotation of the disk (rad), rising to the right
const R_IN = 3.4, R_OUT = 48;         // disk radii in M
const SHADOW_PX = 122 / 736 * W;      // on-screen radius of the shadow
const UNIT = SHADOW_PX / 5.196;       // pixels per M (critical impact parameter = 3*sqrt(3) M)
const CX = 640 / 736 * W, CY = 110 / 414 * H;
const SPIN_RATE = 0.5;                // rad/s at the inner edge when speed = 1
const SHEAR = 1.0;                    // angular velocity ~ r^-SHEAR (Keplerian would be 1.5)
const BOTTOM_BLOOM = 4;               // strength of the extra glow at the bottom of the hole (layers)

// ---- noise ----
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  let s = 0, a = 0.5;
  for (let i = 0; i < 5; i++) { s += a * vnoise(x, y); x = x * 2.03 + 11.7; y = y * 2.03 + 3.1; a *= 0.5; }
  return s;
}
const TAU = 2 * Math.PI;
// angle-periodic noise (blends a with a-2pi so there is no seam at +-pi)
function pfbm(a, k, r) { const w = (a + Math.PI) / TAU; return fbm(a * k, r) * (1 - w) + fbm((a - TAU) * k, r) * w; }
function pvn(a, k, r) { const w = (a + Math.PI) / TAU; return vnoise(a * k, r) * (1 - w) + vnoise((a - TAU) * k, r) * w; }

const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---- colour ramp (as a lookup table) ----
const STOPS = [
  [0.00, 5, 3, 3], [0.18, 46, 22, 11], [0.42, 150, 76, 30],
  [0.66, 238, 150, 72], [0.86, 255, 215, 160], [1.05, 255, 250, 240]
];
const LUT_N = 2048, LUT_MAX = 1.05, LUT_K = (LUT_N - 1) / LUT_MAX;
const lutR = new Uint8Array(LUT_N), lutG = new Uint8Array(LUT_N), lutB = new Uint8Array(LUT_N);
(function buildLut() {
  for (let n = 0; n < LUT_N; n++) {
    const v = n / LUT_K;
    let i = 0; while (i < STOPS.length - 2 && v > STOPS[i + 1][0]) i++;
    const a = STOPS[i], b = STOPS[i + 1], t = clamp((v - a[0]) / (b[0] - a[0]), 0, 1);
    lutR[n] = a[1] + (b[1] - a[1]) * t; lutG[n] = a[2] + (b[2] - a[2]) * t; lutB[n] = a[3] + (b[3] - a[3]) * t;
  }
})();

// ---- disk texture: polar table over (azimuth, radius), rotated at draw time ----
const NA = 1536, NR = 512;
const R_MIN = R_IN - 0.2, DR = (R_OUT - R_MIN) / (NR - 1);
const TV = new Float32Array(NA * NR);   // brightness texture
const TA = new Float32Array(NA * NR);   // opacity texture
function buildTexture() {
  for (let ir = 0; ir < NR; ir++) {
    const r = R_MIN + ir * DR;
    for (let ia = 0; ia < NA; ia++) {
      const a2 = -Math.PI + ia * TAU / NA;
      const d = clamp(pfbm(a2, 2.3, r * 0.9) * 1.9, 0, 1.4);
      const grain = pvn(a2, 16, r * 3.0);
      TV[ir * NA + ia] = (0.12 + 1.5 * Math.pow(d, 1.4)) * (0.7 + 0.6 * grain);
      TA[ir * NA + ia] = clamp(0.1 + 0.8 * d, 0, 0.9);
    }
  }
}

// ---- geometry constants ----
const sI = Math.sin(INCL), cI = Math.cos(INCL);
const cT = Math.cos(TILT), sT = Math.sin(TILT);
const STEP_FAR = 0.06, STEP_NEAR = 0.03;
const CD_F = Math.cos(STEP_FAR), SD_F = Math.sin(STEP_FAR);
const CD_N = Math.cos(STEP_NEAR), SD_N = Math.sin(STEP_NEAR);

// ---- cached disk crossings per pixel (front to back) ----
const MAXC = 3;
const cnt = new Uint8Array(NPIX);
const cRf = new Float32Array(NPIX * MAXC);    // fractional row index into the texture
const cBase = new Float32Array(NPIX * MAXC);  // azimuth (+ spiral offset) in [-pi, pi)
const cOm = new Float32Array(NPIX * MAXC);    // relative angular velocity of the gas there
const cSE = new Float32Array(NPIX * MAXC);    // static brightness: emissivity * Doppler/redshift * edge fade
const cE = new Float32Array(NPIX * MAXC);     // edge fade (scales opacity)
const addL = new Float32Array(NPIX);          // static light: photon ring + haze
const vig = new Float32Array(NPIX);           // vignette factor

function record(p, r, alpha) {
  const n = cnt[p];
  const edge = smooth(R_IN, R_IN + 0.7, r) * (1 - smooth(R_OUT * 0.35, R_OUT, r));
  if (edge <= 0.001) return false;
  const I = Math.pow(R_IN / r, 2.1);
  const v = Math.min(0.6, 1 / Math.sqrt(r - 2));
  const gam = 1 / Math.sqrt(1 - v * v);
  const vLos = -v * Math.sin(alpha) * sI;                    // + = moving toward observer
  const g = Math.sqrt(1 - 2 / r) / (gam * (1 - vLos));
  let a2 = alpha + 1.6 * Math.log(r);                        // gentle spiral shear
  a2 -= TAU * Math.floor((a2 + Math.PI) / TAU);
  const k = p * MAXC + n;
  cRf[k] = clamp((r - R_MIN) / DR, 0, NR - 1.001);
  cBase[k] = a2;
  cOm[k] = Math.pow(R_IN / r, SHEAR);
  cSE[k] = I * Math.pow(g, 2.6) * edge;
  cE[k] = edge;
  cnt[p] = n + 1;
  return true;
}

// Trace one ray; X,Y = offset in the disk frame (units of M); crossings are cached for pixel p.
function trace(X, Y, p) {
  const b = Math.hypot(X, Y);
  if (b < 1e-3) return;
  const e2x = -Y * cI / b, e2y = X / b, e2z = Y * sI / b;
  let u = 0, v = 1 / b, c = 1, sn = 0;
  let prevS = cI;
  for (let k = 0; k < 420; k++) {
    const far = u < 0.035;
    const h = far ? STEP_FAR : STEP_NEAR;
    // RK4 on u'' = -u + 3u^2
    const k1u = v, k1v = -u + 3 * u * u;
    const u2 = u + 0.5 * h * k1u, v2 = v + 0.5 * h * k1v;
    const k2u = v2, k2v = -u2 + 3 * u2 * u2;
    const u3 = u + 0.5 * h * k2u, v3 = v + 0.5 * h * k2v;
    const k3u = v3, k3v = -u3 + 3 * u3 * u3;
    const u4 = u + h * k3u, v4 = v + h * k3v;
    const k4u = v4, k4v = -u4 + 3 * u4 * u4;
    const un = u + h / 6 * (k1u + 2 * k2u + 2 * k3u + k4u);
    const vn = v + h / 6 * (k1v + 2 * k2v + 2 * k3v + k4v);
    const cd = far ? CD_F : CD_N, sd = far ? SD_F : SD_N;
    const cn = c * cd - sn * sd, snn = sn * cd + c * sd;
    const sNew = cn * cI + snn * e2z;

    if (prevS * sNew < 0) {
      const t = prevS / (prevS - sNew);
      const uc = u + t * (un - u);
      if (uc > 0) {
        const r = 1 / uc;
        if (r > R_MIN && r < R_OUT) {
          const cc = c + t * (cn - c), ss = sn + t * (snn - sn);
          const pxx = r * (cc * sI + ss * e2x), pyy = r * ss * e2y;
          record(p, r, Math.atan2(pyy, pxx));
          if (cnt[p] >= MAXC) return;
        }
      }
    }
    if (un >= 0.5 || un <= 0) return;   // fell into the horizon / escaped to infinity
    u = un; v = vn; c = cn; sn = snn; prevS = sNew;
  }
}

// ---- shading ----
const img = ctx.createImageData(W, H);
const pix = img.data;
let active = [];                         // pixels that see the disk (the only ones that change when spinning)

function shadePixel(p, rot) {
  let L = 0;
  const n = cnt[p];
  if (n) {
    let T = 1;
    for (let q = 0; q < n; q++) {
      const k = p * MAXC + q;
      let f = cBase[k] - cOm[k] * rot;
      f -= TAU * Math.floor((f + Math.PI) / TAU);
      const fa = (f + Math.PI) * (NA / TAU);
      const ia = fa | 0, wa = fa - ia, ia1 = ia + 1 === NA ? 0 : ia + 1;
      const rf = cRf[k], ir = rf | 0, wr = rf - ir;
      const o0 = ir * NA, o1 = o0 + NA;
      const tv = (TV[o0 + ia] * (1 - wa) + TV[o0 + ia1] * wa) * (1 - wr) + (TV[o1 + ia] * (1 - wa) + TV[o1 + ia1] * wa) * wr;
      const ta = (TA[o0 + ia] * (1 - wa) + TA[o0 + ia1] * wa) * (1 - wr) + (TA[o1 + ia] * (1 - wa) + TA[o1 + ia1] * wa) * wr;
      const a = ta * cE[k];
      L += T * a * cSE[k] * tv;
      T *= 1 - a;
      if (T < 0.02) break;
    }
  }
  L = (L * 1.25 + addL[p]) * vig[p];
  let idx = (L * LUT_K) | 0;
  idx = idx < 0 ? 0 : idx > LUT_N - 1 ? LUT_N - 1 : idx;
  const o = p * 4;
  pix[o] = lutR[idx]; pix[o + 1] = lutG[idx]; pix[o + 2] = lutB[idx]; pix[o + 3] = 255;
}

function shadeActive(rot) {
  for (let m = 0; m < active.length; m++) shadePixel(active[m], rot);
}

// ---- finishing pass (bloom) ----
const raw = document.createElement('canvas'); raw.width = W; raw.height = H;
const rawCtx = raw.getContext('2d');
function makeSmall(div) {
  const c = document.createElement('canvas');
  c.width = Math.round(W / div); c.height = Math.round(H / div);
  const g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  return { c, g };
}
const small6 = makeSmall(6), small20 = makeSmall(20), small10 = makeSmall(10);
const glow = document.createElement('canvas'); glow.width = W; glow.height = H;
const glowCtx = glow.getContext('2d');
glowCtx.imageSmoothingEnabled = true; glowCtx.imageSmoothingQuality = 'high';
const bx = CX, by = CY + SHADOW_PX * 0.95, br = SHADOW_PX * 1.5;
const glowMask = glowCtx.createRadialGradient(bx, by, 0, bx, by, br);
glowMask.addColorStop(0, 'rgba(0,0,0,1)'); glowMask.addColorStop(0.5, 'rgba(0,0,0,0.6)'); glowMask.addColorStop(1, 'rgba(0,0,0,0)');
ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

function applyFinish(on) {
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(raw, 0, 0);
  if (!on) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const [s, alpha] of [[small6, 0.45], [small20, 0.55]]) {
    s.g.clearRect(0, 0, s.c.width, s.c.height);
    s.g.drawImage(raw, 0, 0, s.c.width, s.c.height);
    ctx.globalAlpha = alpha;
    ctx.drawImage(s.c, 0, 0, W, H);
  }
  // extra bloom concentrated around the bottom edge of the shadow
  small10.g.clearRect(0, 0, small10.c.width, small10.c.height);
  small10.g.drawImage(raw, 0, 0, small10.c.width, small10.c.height);
  glowCtx.globalCompositeOperation = 'source-over';
  glowCtx.clearRect(0, 0, W, H);
  glowCtx.drawImage(small10.c, 0, 0, W, H);
  glowCtx.globalCompositeOperation = 'destination-in';
  glowCtx.fillStyle = glowMask; glowCtx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  for (let k = 0; k < BOTTOM_BLOOM; k++) ctx.drawImage(glow, 0, 0);
  ctx.restore();
}

// ---- progressive first render (traces rays, caches them, paints each row) ----
const panel = document.getElementById('panel');
const statusEl = document.getElementById('status');
const finishBox = document.getElementById('finish');
const spinBox = document.getElementById('spin');
const speedBox = document.getElementById('speed');
const params = new URLSearchParams(location.search);
const fixedTime = params.has('t') ? parseFloat(params.get('t')) : null;   // ?t=SECONDS: one still frame, no animation
let row = 0;

function renderRows(deadline) {
  while (row < H && performance.now() < deadline) {
    const j = row++;
    for (let i = 0; i < W; i++) {
      const p = j * W + i;
      const sx = (i - CX) / UNIT, sy = -(j - CY) / UNIT;
      const X = sx * cT + sy * sT, Y = -sx * sT + sy * cT;
      trace(X, Y, p);
      if (cnt[p]) active.push(p);

      // photon ring: light that has looped around the hole, brightest on the approaching (left/upper-left) side
      const bImp = Math.hypot(X, Y), dB = (bImp - 5.22) / 0.055;
      const ang = Math.atan2(sy, sx);
      const lobe = 0.5 + 0.5 * Math.cos(ang - 2.6);
      let add = 0.8 * Math.exp(-dB * dB) * (0.08 + 0.92 * lobe * lobe);
      const dpx = Math.hypot(i - CX, j - CY);
      add += 0.012 + 0.05 * Math.exp(-dpx / (SHADOW_PX * 2.0)) * (dpx > SHADOW_PX ? 1 : 0.1);
      addL[p] = add;
      const vx = Math.max(0, (W * 0.4 - i) / (W * 0.4)), vy = Math.max(0, (j - H * 0.8) / (H * 0.4));
      vig[p] = 1 - 0.5 * clamp(vx * 0.8 + vy, 0, 1);

      shadePixel(p, fixedTime || 0);
    }
  }
  ctx.putImageData(img, 0, 0);
  if (row < H) setTimeout(() => renderRows(performance.now() + 40), 0);
  else ready();
}

// ---- animation ----
let spinT = fixedTime || 0, last = 0, dirty = true;

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const spinning = spinBox.checked && parseFloat(speedBox.value) > 0;
  if (spinning) { spinT += dt * parseFloat(speedBox.value); }
  if (spinning || dirty) {
    shadeActive(spinT * SPIN_RATE);
    rawCtx.putImageData(img, 0, 0);
    applyFinish(finishBox.checked);
    dirty = false;
  }
  requestAnimationFrame(tick);
}

function ready() {
  shadeActive(spinT * SPIN_RATE);
  rawCtx.putImageData(img, 0, 0);
  applyFinish(finishBox.checked);
  window.__done = true;
  if (fixedTime !== null) { statusEl.hidden = true; panel.classList.remove('busy'); return; }
  for (const el of [finishBox, spinBox, speedBox]) el.disabled = false;
  panel.classList.remove('busy'); statusEl.hidden = true;
  finishBox.addEventListener('change', () => { dirty = true; });
  spinBox.addEventListener('change', () => { dirty = true; });
  requestAnimationFrame(t => { last = t; tick(t); });
}

setTimeout(() => {
  buildTexture();
  statusEl.textContent = 'Tracing rays…';
  setTimeout(() => renderRows(performance.now() + 40), 0);
}, 30);
</script>
</body>
</html>
